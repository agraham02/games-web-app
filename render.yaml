# Render — the recommended free-tier home for this app.
#
# What "free" costs you, stated plainly: a free web service SPINS DOWN
# after about 15 minutes with no inbound traffic, and the next request
# waits ~50 seconds for it to wake. For this app that is milder than it
# sounds — rooms are in-memory and expire a minute after the last person
# leaves, so there is rarely anything to lose — but a room DOES die with
# the process, so two friends arranging to play should both load the page
# before anyone creates a room.
#
# A game in play will not be cut off: the client sends a keepalive every
# 25 seconds, and on top of that the server requests its own public URL
# every few minutes WHILE ANYONE IS CONNECTED (see `keepAwake.ts`, which
# reads RENDER_EXTERNAL_URL — Render sets it, so nothing to configure).
# When nobody is connected it does nothing, and the service sleeps.
#
# Upgrading to the cheapest paid instance removes the spin-down entirely
# and changes nothing else here.
services:
  - type: web
    name: table-games
    runtime: node
    plan: free
    # Free instances get 512MB; the build is the memory-hungry part.
    #
    # `--include=dev` is not optional. Render applies the NODE_ENV below to
    # the BUILD too, and under NODE_ENV=production a bare `npm ci` silently
    # skips devDependencies — where Tailwind's PostCSS plugin and TypeScript
    # live — so `next build` dies with "Cannot find module
    # '@tailwindcss/postcss'" after installing ~80 packages instead of ~500.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    # Deploys are triggered by CI, not by a push. `commit` (Render's
    # default) would deploy every push to the branch the moment it lands,
    # BEFORE the tests have run — so a red commit would go live and CI
    # would merely report on it afterwards. With `off`, the workflow in
    # `.github/workflows/ci.yml` calls this service's deploy hook only
    # once every job has passed, and then checks /healthz reports the
    # commit it just shipped. See deploy.md.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Never set ENABLE_DEBUG_ENDPOINTS here. `/debug/room/:code` dumps a
      # room unredacted and `/debug/drop` hangs up on a player; both are
      # refused in production precisely so a deploy cannot expose them.
